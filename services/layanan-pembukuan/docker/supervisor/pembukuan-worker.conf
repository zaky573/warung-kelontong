[program:pembukuan-penjualan]
process_name=%(program_name)s
command=/usr/bin/php /var/www/html/artisan pembukuan:konsumsi
directory=/var/www/html
user=sail
autostart=true
autorestart=true
startsecs=5
startretries=5
stopasgroup=true
killasgroup=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
